{% extends "base.html" %}
{% block title %}User Auth - Ethical AI System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4">
                <!-- Nav tabs -->
                <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Login</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab">Register</button>
                    </li>
                </ul>

                <div class="tab-content" id="authTabsContent">
                    <!-- Login Pane -->
                    <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                        <h4 class="fw-bold text-center mb-3">Welcome Back</h4>
                        <form action="{{ url_for('login') }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label font-weight-bold">Username or Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" name="username_or_email" class="form-control" placeholder="admin" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label font-weight-bold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary-custom w-100 py-2"><i class="fa-solid fa-right-to-bracket me-2"></i> Login to System</button>
                        </form>
                    </div>

                    <!-- Register Pane -->
                    <div class="tab-pane fade" id="register-pane" role="tabpanel">
                        <h4 class="fw-bold text-center mb-3">Create New Account</h4>
                        <form action="{{ url_for('register') }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control" required placeholder="Choose username">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" name="email" class="form-control" required placeholder="user@domain.com">
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required placeholder="Create strong password">
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold"><i class="fa-solid fa-user-plus me-2"></i> Register Account</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
